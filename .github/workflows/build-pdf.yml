name: Build LaTeX PDFs

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Cancel any in-progress run on the same branch when a new push arrives
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  # ------------------------------------------------------------------
  # Detect which folders have relevant changes.
  # Workflow file changes trigger a full rebuild of all three.
  # ------------------------------------------------------------------
  changes:
    runs-on: ubuntu-latest
    outputs:
      general-cv:  ${{ steps.filter.outputs.general-cv }}
      teaching-cv: ${{ steps.filter.outputs.teaching-cv }}
      swe-resume:  ${{ steps.filter.outputs.swe-resume }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            general-cv:
              - 'general CV/**'
              - '.github/workflows/build-pdf.yml'
            teaching-cv:
              - 'Academic CV/**'
              - '.github/workflows/build-pdf.yml'
            swe-resume:
              - 'SWE Resume/**'
              - '.github/workflows/build-pdf.yml'

  # ------------------------------------------------------------------
  # Build the matrix dynamically so only changed documents are built.
  # matrix context is unavailable in job-level if conditions, so we
  # compute a filtered JSON array here and pass it to the build job.
  # ------------------------------------------------------------------
  compute-matrix:
    needs: changes
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Build filtered matrix
        id: set-matrix
        shell: bash
        run: |
          ALL='[
            {
              "name":        "General CV",
              "filter":      "general-cv",
              "artifact":    "General-CV",
              "working_dir": "general CV",
              "root_file":   "main.tex",
              "use_xelatex": "true",
              "output_pdf":  "main.pdf",
              "release_pdf": "Awnon-Bhowmik-General-CV.pdf"
            },
            {
              "name":        "Teaching CV",
              "filter":      "teaching-cv",
              "artifact":    "Teaching-CV",
              "working_dir": "Academic CV",
              "root_file":   "main.tex",
              "use_xelatex": "false",
              "output_pdf":  "main.pdf",
              "release_pdf": "Awnon-Bhowmik-Teaching-CV.pdf"
            },
            {
              "name":        "SWE Resume",
              "filter":      "swe-resume",
              "artifact":    "SWE-Resume",
              "working_dir": "SWE Resume",
              "root_file":   "main.tex",
              "use_xelatex": "true",
              "output_pdf":  "main.pdf",
              "release_pdf": "Awnon-Bhowmik-SWE-Resume.pdf"
            }
          ]'

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            MATRIX="$ALL"
          else
            MATRIX="[]"
            [[ "${{ needs.changes.outputs.general-cv }}"  == "true" ]] && MATRIX=$(echo "$MATRIX" | jq ". += [$(echo "$ALL" | jq '.[0]')]")
            [[ "${{ needs.changes.outputs.teaching-cv }}" == "true" ]] && MATRIX=$(echo "$MATRIX" | jq ". += [$(echo "$ALL" | jq '.[1]')]")
            [[ "${{ needs.changes.outputs.swe-resume }}"  == "true" ]] && MATRIX=$(echo "$MATRIX" | jq ". += [$(echo "$ALL" | jq '.[2]')]")
          fi

          echo "matrix=$(echo "$MATRIX" | jq -c .)" >> "$GITHUB_OUTPUT"

  # ------------------------------------------------------------------
  # Build — skipped entirely when nothing changed.
  # NOTE: xu-cheng/latex-action runs in Docker, so ubuntu-latest is
  # required. The release job uses shell: bash and is compatible with
  # Linux, macOS, and Windows runners.
  # ------------------------------------------------------------------
  build:
    needs: compute-matrix
    if: needs.compute-matrix.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.compute-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Build ${{ matrix.name }}
        uses: xu-cheng/latex-action@v3
        with:
          root_file:           ${{ matrix.root_file }}
          working_directory:   ${{ matrix.working_dir }}
          latexmk_use_xelatex: ${{ matrix.use_xelatex }}
          args: -file-line-error -halt-on-error -interaction=nonstopmode -outdir=out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name:           ${{ matrix.artifact }}
          path:           "${{ matrix.working_dir }}/out/${{ matrix.output_pdf }}"
          if-no-files-found: error
          retention-days: 30

      - name: Write job summary
        shell: bash
        run: |
          echo "### ${{ matrix.name }} built successfully" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |"                         >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|"                         >> "$GITHUB_STEP_SUMMARY"
          echo "| Artifact | \`${{ matrix.artifact }}\`"        >> "$GITHUB_STEP_SUMMARY"
          echo "| Release file | \`${{ matrix.release_pdf }}\`" >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------------
  # Release — runs after all selected builds succeed, except on pull requests
  # ------------------------------------------------------------------
  release:
    needs: build
    if: always() && needs.build.result == 'success' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path:           artifacts/
          merge-multiple: false

      - name: Rename PDFs for release
        shell: bash
        run: |
          mkdir -p release
          [ -f "artifacts/General-CV/main.pdf" ]         && cp "artifacts/General-CV/main.pdf"         release/Awnon-Bhowmik-General-CV.pdf  || true
          [ -f "artifacts/Teaching-CV/main.pdf" ]        && cp "artifacts/Teaching-CV/main.pdf"        release/Awnon-Bhowmik-Teaching-CV.pdf || true
          [ -f "artifacts/SWE-Resume/main.pdf" ]         && cp "artifacts/SWE-Resume/main.pdf"         release/Awnon-Bhowmik-SWE-Resume.pdf  || true
          pdfs=(release/*.pdf)
          if [[ ! -e "${pdfs[0]}" ]]; then
            echo "No PDFs found in downloaded artifacts" >&2
            exit 1
          fi
          printf '%s\n' "${pdfs[@]}"

      - name: Release PDFs
        uses: softprops/action-gh-release@v2
        with:
          tag_name:    latest
          name:        Latest CV Build
          files:       release/*.pdf
          fail_on_unmatched_files: true
          body: |
            Automated PDF build from the latest commit on `main`.

            | File | Description |
            |------|-------------|
            | `Awnon-Bhowmik-General-CV.pdf`  | General CV (`general CV/main.tex`) |
            | `Awnon-Bhowmik-Teaching-CV.pdf` | Teaching CV (`Academic CV/main.tex`) |
            | `Awnon-Bhowmik-SWE-Resume.pdf`  | SWE Resume (`SWE Resume/main.tex`) |
          make_latest: true

      - name: Write release summary
        shell: bash
        run: |
          echo "### Released to \`latest\`" >> "$GITHUB_STEP_SUMMARY"
          echo "| File |"                   >> "$GITHUB_STEP_SUMMARY"
          echo "|------|"                   >> "$GITHUB_STEP_SUMMARY"
          for f in release/*.pdf; do
            echo "| \`$(basename "$f")\` |" >> "$GITHUB_STEP_SUMMARY"
          done
